    <div class="login-box">


        <form action="backend/login.php" method="post">


            <h2>Login</h2>


            <!-- Email -->

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="mail"></ion-icon>
                </span>

                <input
                    type="email"
                    name="email"
                    required
                >

                <label>Email ID</label>

            </div>


            <!-- Password -->

            <div class="input-box">

                <span class="icon">
